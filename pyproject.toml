[project]
name = "deployfish"
version = "1.16.1"
authors = [
    {name = "Caltech IMSS ADS", email = "imss-ads-staff@caltech.edu"},
]
maintainers = [
    {name = "Chris Malek", email = "cmalek@caltech.edu"},
    {name = "Glenn Bach", email = "glenn@caltech.edu"},
    {name = "Katarina Liu", email = "kml@caltech.edu"},
]
requires-python = ">= 3.11"
description = "AWS ECS related deployment tools"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "boto3 >= 1.26.36",
    "cement==3.0.10",
    "click >= 6.7",
    "colorlog",
    "jinja2 >= 2.11",
    "jsondiff2 >= 1.2.3",
    "pytz",
    "PyYAML >= 5.1",
    "requests >= 2.18.4",
    "shellescape >= 3.8.1",
    "tabulate >= 0.8.1",
    "typing_extensions",
    "tzlocal >= 4.0.1",
    "docker >= 7.1.0",
    "slack_sdk >= 3.31.0",
    "slackfin >= 0.2.2",
    "gitpython >= 3.1.43",
    "giturlparse >= 0.12.0",
    "setuptools < 80",
    "simplesqs >= 0.4.0",
    "toml >= 0.10.2",
    "debugpy>=1.8.21",
]

[dependency-groups]
docs = [
  "Sphinx>=7",
  "sphinx_rtd_theme == 2.0.0",
  "sphinxcontrib-images >= 0.9.4",
  "setuptools>=75.1.0",
]
test = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "pytest-mock>=3.14.0",
  "pytest-env>=0.8.1",
  "pytest-timeout>=2.1.0",
  "pytest-xdist>=3.5.0",
  "pytest-randomly>=3.12.0",
]
dev = [
  "icecream>=2.1.5",
  "ipython>=7.23.0",
  "ruff>=0.15.11",
  "mypy>=1.20.1",
  "build>=1.5.0",
]

[project.urls]
Respository = "https://github.com/caltechads/deployfish"
Documentation = "https://deployfish.readthedocs.io/en/latest/"

[project.scripts]
deploy = "deployfish.main:main"
dpy = "deployfish.main:main"

[tool.uv]
python-preference = "only-system"
default-groups = ["docs", "test"]

[tool.setuptools.package-data]
deployfish = ["py.typed", "templates/*.jinja2", "templates/macros/*.jinja2"]

[tool.setuptools]
# ...
# By default, include-package-data is true in pyproject.toml, so you do
# NOT have to specify this line.
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = [
    "setuptools >= 48",
    "wheel >= 0.29.0",
    "toml == 0.10.2",
]
build-backend = "setuptools.build_meta"

###############################################################################
# Ruff Configuration
###############################################################################
[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
# Tell ruff that this project's python code all lives inside the {{cookiecutter.project_python_name}} subfolder.
src = ["deployfish"]
# Don't lint the venv, the test code, or the migrations.
exclude = [".venv"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Disable auto-formatting of code examples in docstrings.
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future, so we're opting out now.
docstring-code-format = false
# Set the line length limit used when formatting code snippets in docstrings.
# This only has an effect when the docstring-code-format = true.
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["ALL"]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables if their names are underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
ignore = [
    #### Ignore entire modules
    "ANN",  # flake8-annotations
    "COM",  # flake8-commas
    "C90",  # mccabe complexity
    "TID",  # flake8-tidy-imports

    #### Ignore specific rules
    "CPY001",   # ignore missing copyright notices
    "D100",     # ignore missing docs
    "D101",     # ignore Missing docstring in public class
    "D102",     # ignore Missing docstring in public method
    "D103",     # ignore Missing docstring in public function
    "D104",     # ignore Missing docstring in public package
    "D105",     # ignore Missing docstring in magic method
    "D106",     # ignore Missing docstring in public nested class
    "D107",     # ignore Missing docstring in __init__ method
    "D200",     # One-line docstring should fit on one line
    "D203",     # 1 blank required before class docstring
    "D205",     # 1 blank line required between summary line and description
    "D211",     # No blank lines allowed before class docstring
    "D212",     # Multi-line docstring summary should start at the first line
    "D400",     # First line of docstring should end with a period
    "D401",     # First line of docstring should be in imperative mood
    "D415",     # First line of docstring should end with a period, question mark, or exclamation point
    "DOC201",   # Ignore missing "Return" section in docstring
    "E402",     # Ignore imports that aren't at the top of the file
    "FIX002",   # Line contains "TODO", consider resolving the issue
    "N818",     # Stop bugging me about not ending my exceptions with "Error"
    "PLC0415",  # Ignore imports that aren't at the top level. Sometimes that's needed to avoid circular imports
    "PLR6201",  # Ignore list literals used in membership tests. We don't care about the performance boost from sets
    "RUF012",   # Ignore mutable class attrs. Wagtail expects lists for a lot of those, and our code never touches them
    "S603",     # ignore subprocess calls that do not check return code
    "S607",     # ignore subprocess programs that are not absolute paths
    "SIM102",   # Don't try to combine nested ifs
    "SLF001",   # Ignore access to attributes starting with a single _. Django's Model._meta is used all over the place.
    "TD002",    # Missing author in TODO; try: # TODO(<author_name>): ... or # TODO @<author_name>:
    "TD003",    # Missing issue link on the line following this TODO
    "TRY003",   # external messages in exceptions are too verbose
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["deployfish"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["deployfish", "tests"]

[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "cement",
    "cement.*",
    "debugpy",
    "jsondiff",
    "simplesqs",
    "simplesqs.*",
    "slackfin",
    "tabulate",
    "yaml",
]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"deployfish/types.py" = ["A005"]
"test/**/*.py" = ["S101"]
"test/*.py" = ["S101"]
"tests/**/*.py" = ["S101"]

[tool.vulture]
# Configuration for vulture: https://github.com/jendrikseipp/vulture
# Install in your virtual environment and run:
# python -m vulture | tail -r | less
# The below configuration tries to remove some false positives, but there are
# still many, for example for model properties used only in templates.
# See also:
# https://adamj.eu/tech/2023/07/12/django-clean-up-unused-code-vulture/
exclude = [
  "test/*.py",
]
ignore_decorators = [
  # pytest
  "@pytest.fixture",
]
ignore_names = [
]
paths = [
  "deployfish",
]
min_confidence = 70
sort_by_size = true
